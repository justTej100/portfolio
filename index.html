<!DOCTYPE html>

<head>
<link rel="stylesheet" type="text/css" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bangers&family=Bebas+Neue&family=Bungee&family=Bungee+Shade&family=Creepster&family=Permanent+Marker&family=Righteous&family=Rubik+Mono+One&family=Russo+One&family=Special+Elite&family=Staatliches&family=Teko:wght@700&family=Titan+One&family=Orbitron:wght@900&family=Faster+One&family=Monoton&family=Fjalla+One&family=Alfa+Slab+One&family=Black+Ops+One&family=Chela+One&family=Frijole&family=Nosifer&family=Rubik+Glitch&family=Vast+Shadow&family=Ultra&family=Shrikhand&display=swap" rel="stylesheet">
<title>Tejinder</title>

<!-- Tab icon: GitHub profile picture. The square link works everywhere and the
     script below swaps it for a circular crop when the browser allows it. -->
<link rel="icon" id="site-icon" href="https://avatars.githubusercontent.com/u/181138594?v=4&amp;s=64">
<link rel="apple-touch-icon" href="https://avatars.githubusercontent.com/u/181138594?v=4&amp;s=180">
<script>
(function(){
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){
    try{
      var n=64,c=document.createElement('canvas');c.width=c.height=n;
      var x=c.getContext('2d');
      x.beginPath();x.arc(n/2,n/2,n/2,0,Math.PI*2);x.closePath();x.clip();
      x.drawImage(img,0,0,n,n);
      var url=c.toDataURL('image/png');
      var old=document.getElementById('site-icon');
      var l=document.createElement('link');l.rel='icon';l.type='image/png';l.id='site-icon';l.href=url;
      if(old&&old.parentNode)old.parentNode.removeChild(old);
      document.head.appendChild(l);
    }catch(e){}
  };
  img.src='https://avatars.githubusercontent.com/u/181138594?v=4&s=128';
})();
</script>

<!-- Profile picture badge (self-contained so it does not depend on style.css) -->
<style>
  #ghAvatar{position:fixed;top:16px;right:16px;z-index:50;display:block;width:48px;height:48px;
    border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.35);
    transition:transform .2s ease,box-shadow .2s ease}
  #ghAvatar:hover,#ghAvatar:focus-visible{transform:scale(1.08);box-shadow:0 4px 16px rgba(0,0,0,.5)}
  #ghAvatar img{display:block;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>

<div id="introOverlay">
<div id="introPct">0<span id="introPctSign">%</span></div>
</div>

<a id="ghAvatar" href="https://github.com/justTej100" target="_blank" rel="noopener"
   aria-label="justTej100 on GitHub" title="justTej100 on GitHub">
<img src="https://avatars.githubusercontent.com/u/181138594?v=4&s=128" width="48" height="48"
     alt="justTej100 GitHub profile picture" onerror="this.parentNode.style.display='none'">
