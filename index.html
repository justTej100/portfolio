<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" type="text/css" href="style.css">
<title>Tejinder</title>

<!-- Tab icon: GitHub profile picture. The square link works everywhere and the
     script below swaps it for a circular crop when the browser allows it. -->
<link rel="icon" id="site-icon" href="https://avatars.githubusercontent.com/u/181138594?v=4&amp;s=64">
<link rel="apple-touch-icon" href="https://avatars.githubusercontent.com/u/181138594?v=4&amp;s=180">
<!-- Tab icon: GitHub profile picture. The square link is the fallback. The script below
     upgrades it to a circular crop. It uses its own image size (s=96) so it never shares a
     cache entry with the other avatar requests on the page, and it retries once on failure. -->
<script>
(function(){
  var BASE='https://avatars.githubusercontent.com/u/181138594?v=4';
  function swap(url){
    var old=document.getElementById('site-icon'),l=document.createElement('link');
    l.rel='icon';l.type='image/png';l.sizes='64x64';l.id='site-icon';l.href=url;
    if(old&&old.parentNode)old.parentNode.removeChild(old);
    document.head.appendChild(l);
  }
  function circle(img){
    var n=64,c=document.createElement('canvas');c.width=c.height=n;
    var x=c.getContext('2d');
    x.beginPath();x.arc(n/2,n/2,n/2,0,Math.PI*2);x.closePath();x.clip();
    x.drawImage(img,0,0,n,n);
    return c.toDataURL('image/png');
  }
  function load(src,retry){
    var img=new Image();img.crossOrigin='anonymous';
    img.onload=function(){
      try{swap(circle(img));console.info('[icon] circular icon applied');}
      catch(e){console.info('[icon] canvas blocked, keeping square icon');}
    };
    img.onerror=function(){
      if(retry){console.info('[icon] first load failed, retrying');load(src+'&r='+Date.now(),false);}
      else console.info('[icon] avatar unreadable, keeping square icon');
    };
    img.src=src;
  }
  load(BASE+'&s=96',true);
})();
</script>

</head>
<body>

<div id="introOverlay">
<div id="introPct">0<span id="introPctSign">%</span></div>
</div>

<a id="ghAvatar" href="https://github.com/justTej100" target="_blank" rel="noopener"
   aria-label="justTej100 on GitHub" title="justTej100 on GitHub">
<img src="https://avatars.githubusercontent.com/u/181138594?v=4&s=128" width="48" height="48"
     alt="justTej100 GitHub profile picture" onerror="this.parentNode.style.display='none'">
</a>

<main>
<div class="tejinder">
<canvas id="nameCanvas" onclick="triggerName()"></canvas>
<div class="buttonC">
<button>About</button>
<button>Work EXP</button>
<button>Resume</button>
<button>Contact</button>
</div>
</div>
</main>

<div class="waves-wrap">
<div>
<svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
<defs>
<path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
</defs>
<g class="parallax">
<use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(0,0,0,0.7)" />
<use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(0,0,0,0.5)" />
<use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(0,0,0,0.3)" />
<use xlink:href="#gentle-wave" x="48" y="7" fill="rgba(0,0,0,1)" />
</g>
</svg>
</div>
<div class="flip-upside-down">
<svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
<defs>
<path id="gentle-wave2" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
</defs>
<g class="parallax">
<use xlink:href="#gentle-wave2" x="48" y="0" fill="rgba(0,0,0,0.7)" />
<use xlink:href="#gentle-wave2" x="48" y="3" fill="rgba(0,0,0,0.5)" />
<use xlink:href="#gentle-wave2" x="48" y="5" fill="rgba(0,0,0,0.3)" />
<use xlink:href="#gentle-wave2" x="48" y="7" fill="rgba(0,0,0,1)" />
</g>
</svg>
</div>
</div>

<script src="script.js"></script>

</body>
</html>
