<script>
/* If resume.pdf exists in the repo root, swap in a download button and a preview. */
(function () {
  var box = document.getElementById('resumeBox');
  fetch('../resume.pdf', { method: 'HEAD' }).then(function (r) {
    if (!r.ok) return;
    box.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'lead';
    p.textContent = 'Download my resume as a PDF, or read it below.';
    var a = document.createElement('a');
    a.className = 'btn'; a.href = '../resume.pdf'; a.download = 'Tejinder-Bajaj-Resume.pdf'; a.textContent = 'Download PDF';
    var d = document.createElement('div'); d.className = 'actions'; d.appendChild(a);
    var f = document.createElement('iframe');
    f.className = 'pdf-frame'; f.src = '../resume.pdf'; f.title = 'Resume of Tejinder (TJ) Bajaj';
    box.appendChild(p); box.appendChild(d); box.appendChild(f);
  }).catch(function () {});
})();
</script>
